services:
  thomas-pdf2img:
    image: ${PDF2IMG_IMAGE:?Set the verified digest-pinned image}
    container_name: thomas-pdf2img
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: pdf2img
      tsdproxy.container_port: "3000"
      tsdproxy.funnel: "false"
      tsdproxy.ephemeral: "false"
    networks: [isolated_nw]
networks:
  isolated_nw:
    external: true
