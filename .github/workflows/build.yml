name: Test and scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime
        run: docker build --build-arg COMMIT_SHA="$GITHUB_SHA" -t pdf2img:ci .
      - name: Conversion and security regression tests
        run: docker run --rm --memory 1g --cpus 2 --pids-limit 128 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g -v "$PWD/test:/app/test:ro" --entrypoint node pdf2img:ci --test test/security.test.mjs
      - name: Scan all severities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/reports" aquasec/trivy:0.75.0 image --scanners vuln --format json --output /reports/trivy.json pdf2img:ci
      - name: Reject critical and high vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 pdf2img:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy
          path: trivy.json
